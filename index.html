<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TundeCodes has moved</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="TundeCodes has moved to tundecodes.github.io." />
    <link rel="canonical" href="https://tundecodes.github.io/" />
    <meta http-equiv="refresh" content="0; url=https://tundecodes.github.io/" />
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #efeee8; color: #10110f; }
      main { width: min(760px, calc(100vw - 40px)); border-top: 1px solid #bfc1b9; padding-top: 24px; }
      .eyebrow { font: 800 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; color: #3e9425; }
      h1 { margin: 20px 0 18px; font-size: clamp(3rem, 10vw, 7rem); line-height: .9; letter-spacing: -.07em; }
      p { max-width: 620px; color: #676861; font-size: 1.05rem; line-height: 1.6; }
      a { color: inherit; font-weight: 800; text-decoration: none; border-bottom: 1px solid currentColor; }
    </style>
    <script>
      (function () {
        var target = 'https://tundecodes.github.io' + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="eyebrow">DEBUG / ROUTE MIGRATED</div>
      <h1>TundeCodes moved.</h1>
      <p>You are being redirected to the new portfolio. If nothing happens, <a href="https://tundecodes.github.io/">open tundecodes.github.io</a>.</p>
    </main>
  </body>
</html>
